# ココナラ案件ツールの設定
# 「#」から後ろはメモです。数字や言葉は自由に変えてください。

# ---------------------------------------------------------------
# あなたについて
# ---------------------------------------------------------------
display_name: "Yuumi"      # 提案文で名乗る名前（ココナラのユーザー名に合わせる）
revisions_included: 2      # 提案文に書く「修正は○回まで」
hours_per_day: 3           # ココナラに使える1日の時間（納期の計算に使う）

# ---------------------------------------------------------------
# お金の基準
# ---------------------------------------------------------------
fee_rate: 0.22             # ココナラの販売手数料（2026年時点 22%）。変わったら直す
target_hourly_yen: 3000    # 手数料を引いたあとの、目標の時給（円）
min_budget_yen: 3000       # 予算の上限がこれより低い案件は外す

# ---------------------------------------------------------------
# ① 案件検索
# ---------------------------------------------------------------
search:
  base_url: "https://coconala.com"
  # キーワード検索のURLの形。{keyword} の部分に下のキーワードが入ります
  url_template: "{base}/requests?keyword={keyword}"
  keywords:
    - アメリカ 調査
    - 海外 リサーチ
    - 市場調査
    - 競合調査
    - マーケティング戦略
    - プレスリリース
    - ブランディング
    - 英語 翻訳
  # ブラウザで条件（カテゴリ・募集中のみ・新着順など）を選んだあとのURLを
  # ここに貼ると、そのページも見ます。うまく案件が見つからないときはこちらを使う
  extra_urls: []
  pages_per_search: 1      # 1つの検索で何ページ目まで見るか
  page_param: "page"       # 2ページ目以降のURLに付ける名前（?page=2）
  max_new_requests: 30     # 1回で詳しく読む新着案件の上限
  wait_seconds: [4, 8]     # ページを開く間隔（秒）。サイトに負担をかけないため短くしない

# ---------------------------------------------------------------
# ② 案件の選別：得意分野（第1〜第5候補）
#   weight = 優先度（高いほど上に来る）
#   hours  = その分野の案件にかかる時間の目安
#   keywords = タイトル・本文・カテゴリに入っていたら「合う」と判断する言葉
# ---------------------------------------------------------------
categories:
  - name: 米国・NY市場調査、海外リサーチ
    weight: 100
    hours: 8
    keywords: [ニューヨーク, NY, 米国, アメリカ, 北米, 海外市場, 海外調査, 海外リサーチ,
               現地調査, 現地情報, 英語圏, 市場調査, リサーチ, 海外, 現地]
  - name: マーケティング戦略、競合分析
    weight: 90
    hours: 6
    keywords: [マーケティング, 戦略, 競合, 競合分析, 競合調査, ペルソナ, カスタマージャーニー,
               ポジショニング, 市場分析, 3C, SWOT, ターゲット, 集客, 販促]
  - name: PR・広報、ブランド戦略
    weight: 80
    hours: 5
    keywords: [PR, 広報, プレスリリース, ブランディング, ブランド, メディア, 取材,
               ニュースレター, コンセプト, ストーリー]
  - name: 英日翻訳、英文ライティング
    weight: 70
    hours: 4
    keywords: [翻訳, 英訳, 和訳, 英日, 日英, 英語, 英文, ローカライズ, 英語記事, 英語メール]
  - name: 海外企業・業界の調査レポート
    weight: 60
    hours: 10
    keywords: [調査レポート, レポート, 業界調査, 企業調査, 海外企業, 業界動向, トレンド,
               デスクリサーチ, 情報収集]

# 文字数・語数から作業時間を計算するときの速さ
chars_per_hour: 1200       # 日本語の文字数（翻訳・ライティング）
words_per_hour: 400        # 英語の語数

# ---------------------------------------------------------------
# 避ける案件（入っていたら外す）
#   "re:" で始まるものは正規表現
# ---------------------------------------------------------------
avoid:
  無報酬:
    - 無報酬
    - 無償
    - 報酬なし
    - ボランティア
    - ノーギャラ
    - 無料で
    - タダで
    - "re:(?<![\\d,])0円"
  修正が多すぎる:
    - 修正無制限
    - 修正回数無制限
    - 修正回数は無制限
    - 何度でも修正
    - 何回でも修正
    - 納得いくまで
    - 修正し放題
  ココナラ外への誘導・あやしい案件:
    - LINEで
    - LINE登録
    - LINE追加
    - LINE交換
    - 公式LINE
    - チャットワーク
    - Chatwork
    - 直接取引
    - 誰でも簡単
    - スマホだけ
    - 初期費用
    - 登録するだけ

# 内容がはっきりしない案件のサイン（本文が短いときだけ外す）
unclear_phrases: [詳細はメッセージ, 詳細はDM, 詳しくはメッセージ, 詳細は個別, 詳細は応募後, 内容は応募後]
min_description_chars: 60  # 本文がこれより短い案件は「内容が不明確」として外す

# 外さないが、点数を下げる言葉
caution:
  - phrase: ネイティブ
    note: 英語ネイティブが条件かもしれない
  - phrase: 継続
    note: 長く続く仕事。最初の負担を確認する
  - phrase: 急ぎ
    note: 納期が短い

# ---------------------------------------------------------------
# ③ 優先順位の付け方（合計が1になるように）
# ---------------------------------------------------------------
score_weights:
  fit: 0.4        # スキルとの合い方
  pay: 0.3        # 時給（手取り）
  win: 0.2        # 受注しやすさ（提案数が少ないほど高い）
  clarity: 0.1    # 内容のわかりやすさ
min_fit: 35       # スキルの点がこれより低い案件は外す
rank_a: 70        # この点以上はA（すぐ応募したい）
rank_b: 55        # この点以上はB（検討）

# ---------------------------------------------------------------
# ④ 提案文：Claude API（.env に ANTHROPIC_API_KEY を入れたときだけ使う）
#   キーがないときは、テンプレートで提案文を作ります
# ---------------------------------------------------------------
ai:
  enabled: auto            # auto = キーがあれば使う / false = 使わない
  model: claude-opus-5-5
  effort: medium           # low / medium / high（高いほど丁寧だが、時間と費用が増える）
  max_reviews: 8           # 1回の実行でAIが読む案件の数（上位から）

# ---------------------------------------------------------------
# ブラウザ
# ---------------------------------------------------------------
browser:
  channel: chrome          # パソコンの Google Chrome を使う。無い場合は自動で Chromium を使う
  profile_dir: .browser-profile   # ログイン状態を保存する場所（他の人に渡さない）
  executable_path: ""      # 特別な場合だけ使う

# 結果の保存先
output_dir: output
data_dir: data
